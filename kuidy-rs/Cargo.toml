[package]
name = "kuidy"
description = "kuidy-lyrics en Rust, sobre chaika"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["yoiberdev <yoiber696@gmail.com>"]

[dependencies]
chaika = { path = "../../chaika/crates/chaika" }
log = "0.4"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PKCE: SHA-256 para el desafio y aleatoriedad para el verificador.
sha2 = "0.10"
rand = "0.9"
# Abrir el navegador. Parece que sobra hasta que ves que `cmd /C start` se
# come todo lo que va tras un `&` y expande los `%` de una URL codificada.
open = "5"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[build-dependencies]
resvg = { version = "0.48.1", default-features = false }
usvg = { version = "0.48.1", default-features = false }
tiny-skia = "0.12"
winresource = "0.1.31"
