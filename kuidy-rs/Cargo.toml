[package]
name = "kuidy"
description = "kuidy-lyrics en Rust, sobre chaika"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["yoiberdev <yoiber696@gmail.com>"]

[dependencies]
chaika = { path = "../../chaika/crates/chaika" }
log = "0.4"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Abrir la carpeta de logs en el explorador sin pasar por `cmd`.
open = "5"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[build-dependencies]
resvg = { version = "0.48.1", default-features = false }
usvg = { version = "0.48.1", default-features = false }
tiny-skia = "0.12"
winresource = "0.1.31"

# Lo que suena, preguntandoselo al sistema en lugar de a Spotify. Va aparte
# porque es la unica atadura de kuidy a un sistema operativo concreto: en
# Linux el equivalente es MPRIS sobre D-Bus, y entraria aqui al lado.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_Com"] }
windows-future = "0.3.2"
