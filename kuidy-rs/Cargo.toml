[package]
name = "kuidy"
description = "kuidy-lyrics en Rust, sobre chaika"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["yoiberdev <yoiber696@gmail.com>"]

[dependencies]
chaika = { path = "../../chaika/crates/chaika" }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
