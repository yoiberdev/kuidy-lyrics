  <path d="M192 34 C248 52 258 108 218 146 C240 106 228 70 192 60 Z" fill="#ff9ec7"/>

  <g transform="rotate(-7 100 158)">
    <circle cx="100" cy="158" r="86" fill="#9a8bff"/>
    <circle cx="72" cy="142" r="18" fill="#1a1030"/>
    <circle cx="130" cy="142" r="18" fill="#1a1030"/>
    <path d="M70 190 Q100 182 130 190 Q128 224 100 224 Q72 224 70 190 Z" fill="#1a1030"/>
  </g>
</svg>
