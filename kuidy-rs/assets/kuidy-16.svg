<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- El mismo peluche a 16 pixeles, y aqui solo la cabeza.
       Con el cuerpo entero le tocan ocho pixeles a la cabeza, tres a las
       orejas y el resto a una mancha; recortando al busto, esos mismos
       dieciseis pixeles se gastan en lo unico que se reconoce. Las orejas
       van redondas y casi rectas: ladeadas salen en punta y parece un gato.
       Tampoco hay costuras, ni etiqueta, ni panza: a este tamano son barro. -->
  <circle cx="62" cy="70" r="36" fill="#e79a42"/>
  <circle cx="194" cy="70" r="36" fill="#e79a42"/>
  <circle cx="62" cy="72" r="17" fill="#fdeacb"/>
  <circle cx="194" cy="72" r="17" fill="#fdeacb"/>

  <ellipse cx="128" cy="146" rx="98" ry="90" fill="#e79a42"/>

  <ellipse cx="93" cy="130" rx="16" ry="18" fill="#43291a"/>
  <ellipse cx="163" cy="130" rx="16" ry="18" fill="#43291a"/>

  <ellipse cx="128" cy="188" rx="40" ry="30" fill="#fdeacb"/>
  <ellipse cx="128" cy="180" rx="15" ry="11" fill="#43291a"/>
</svg>
