<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- La misma mascota, dibujada para 16 pixeles.
       A ese tamano cada rasgo mide un pixel y medio, asi que aqui no hay
       degradado, ni brillo, ni mofletes: todo eso se convierte en barro.
       Queda solo lo que aun se distingue (silueta, dos ojos y la boca) y
       mas gordo de lo que tocaria. -->
