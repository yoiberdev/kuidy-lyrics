<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="cuerpo" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#6f9dff"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.32" cy="0.24" r="0.52">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- La plica y el corchete. Van detras del cuerpo y son gruesos a
       proposito: a 16 pixeles la cara se pierde y lo unico que queda es
       la silueta, asi que la silueta tiene que decir "musica" ella sola. -->
  <path d="M176 150 L176 52 Q176 38 190 38 Q204 38 204 52 L204 150 Z" fill="#ff9ec7"/>
  <path d="M194 40 C246 56 258 108 220 144 C240 106 228 74 194 62 Z" fill="#ff9ec7"/>

  <!-- Todo lo que es la criatura va inclinado: la cabeza recta parecia un
       emoji, y siete grados bastan para que se lea que se esta dejando
       llevar. La nota se queda vertical, que es como se escribe. -->
  <g transform="rotate(-7 106 158)">

  <!-- El cuerpo -->
  <ellipse cx="106" cy="158" rx="88" ry="80" fill="url(#cuerpo)"/>
  <ellipse cx="106" cy="158" rx="88" ry="80" fill="url(#brillo)"/>

  <!-- Los mofletes -->
  <ellipse cx="44" cy="188" rx="21" ry="13" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="166" cy="188" rx="21" ry="13" fill="#ff8fb8" opacity="0.55"/>

  <!-- Los ojos: grandes y juntos, que es lo unico que sobrevive al
       reducir -->
  <ellipse cx="80" cy="144" rx="16" ry="21" fill="#1a1030"/>
  <ellipse cx="134" cy="144" rx="16" ry="21" fill="#1a1030"/>
  <circle cx="86" cy="135" r="6" fill="#ffffff"/>
  <circle cx="140" cy="135" r="6" fill="#ffffff"/>

  <!-- Cantando: el techo plano y la curva abajo es lo que lo separa de
       una boca de susto -->
  <path d="M82 184 Q107 176 132 184 Q130 218 107 218 Q84 218 82 184 Z" fill="#1a1030"/>
  <ellipse cx="107" cy="208" rx="13" ry="8" fill="#ff7aa8"/>

  </g>
</svg>
